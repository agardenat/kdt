[package]
name = "kdt-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface web de kdt, adossée à kdt-identity"

[dependencies]
# Le métier vient de kdt, jamais d'une copie : les verdicts sont ce que kdt apporte, et deux
# implémentations divergeraient sans que personne s'en aperçoive. Sans la feature `tui` : un
# serveur n'a pas de terminal à dessiner.
kdt = { path = "../..", default-features = false }

# Le contrat du portail est défini une fois, chez kdt-identity, et utilisé des deux côtés.
# Épinglé sur un commit : le flow d'autorisation est plus récent que le dernier tag publié, et
# une branche mouvante rendrait la compilation non reproductible. À remplacer par un tag dès que
# kdt-identity aura publié la version qui le porte.
kdt-identity-api = { git = "https://github.com/agardenat/kdt-identity", rev = "cf89d012ca083ab39137164051a1fbd4e9737571", default-features = false }

kube = { version = "3.1", default-features = false, features = ["client", "runtime", "rustls-tls", "socks5", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
# `AuthInfo` porte ses secrets dans ce type : il faut le crate pour en construire un.
secrecy = "0.10"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.4"
subtle = "2"
zeroize = "1"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
