# Le témoin négatif : une CRD sans webhook de conversion ne doit PAS apparaître dans le monde
# conversion. La vue liste les CRD qui convertissent par webhook, pas l'inventaire des CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.kdt.test
spec:
  group: kdt.test
  scope: Namespaced
  names:
    kind: Gadget
    plural: gadgets
    singular: gadget
  conversion:
    strategy: None
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
