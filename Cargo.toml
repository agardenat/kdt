[package]
name = "kdt"
version = "1.22.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
kube = { version = "3.1", default-features = false, features = ["client", "runtime", "rustls-tls", "socks5", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# The client stack of `connect.rs`, rebuilt to slot in a DNS resolver that sorts IPv4 first.
# All three are already transitive dependencies of kube: naming them costs no extra compilation.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-timeout = "0.5"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Reflector compare ses listes de namespaces avec des regex .NET : la vue `:reflector` doit les
# évaluer à l'identique pour dire où un miroir est attendu. Déjà présente en dépendance
# transitive — la déclarer ici ne coûte aucune compilation supplémentaire.
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http = "1"
base64 = "0.22"
x509-parser = "0.16"
# Everything velero serves through a DownloadRequest (backup logs, restore logs, results) is
# gzipped, with no option to ask for plain text: reading a run log means un-gzipping it.
flate2 = "1"
typst = "0.14"
typst-pdf = "0.14"
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"