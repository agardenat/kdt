# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

# L'image des runners Linux est **nommée**, pas `ubuntu-latest`. Le label bascule vers Ubuntu 26
# le 19 octobre 2026, et une release ne doit pas changer de base de construction au moment où on
# pose un tag : c'est le pire moment pour découvrir qu'un outil de packaging a bougé. À relever
# délibérément, en regardant ce que `packaging/` y gagne ou y perd.
#
# `macos-latest` n'est pas épinglé pour l'instant : le libellé de la bouteille Homebrew porte le
# nom de la plateforme, donc changer de runner change ce que la formule publie — un choix qui se
# fait avec le tap, pas ici.
#
# Les actions sont sur leur première version majeure en Node 24 (checkout v5, setup-helm v5,
# gh-release v3, docker v4/v7). Node 20 est déprécié côté runner depuis septembre 2026 : il était
# encore forcé sur Node 24, ce qui marchait sans être promis.

jobs:
  # L'image de kdt-web, construite sur le même tag que les binaires : ce qui tourne dans un
  # cluster correspond alors à une version publiée, et non à ce qu'un poste avait sous la main.
  #
  # linux/amd64 seulement. kdt tire plus de six cents crates — typst compris — et une seconde
  # architecture émulée par QEMU dépasserait la limite de six heures d'un runner. Le jour où
  # arm64 sera nécessaire, ce sera par un runner arm natif et un manifeste fusionné, pas par
  # l'émulation.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/agardenat/kdt-web:$version"
          # `latest` ne suit que les versions finales : une pré-version le ferait pointer sur une
          # alpha pour tous ceux qui ne pinnent pas.
          case "$version" in
            *-*) ;;
            *) tags="$tags,ghcr.io/agardenat/kdt-web:latest" ;;
          esac
          echo "TAGS=$tags" >> $GITHUB_ENV

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Le chart part avec l'image, vers le dépôt de charts servi par GitHub Pages : un
  # `helm repo add kdt https://agardenat.github.io/helm-charts` suffit alors à l'installer, sans
  # copie du dépôt. Une pré-version peut y figurer sans danger — Helm ne retient une version
  # instable que si `--devel` ou un `--version` explicite la demande.
  chart:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5

      - name: Dépôt de charts
        uses: actions/checkout@v5
        with:
          repository: agardenat/helm-charts
          token: ${{ secrets.CHARTS_TOKEN }}
          path: charts-repo

      - name: Empaqueter et réindexer
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://agardenat.github.io/helm-charts"
          # Deux dépôts publient dans le même index : un push peut être refusé parce que l'autre
          # est passé entre-temps. On repart alors de l'état distant et on refait le paquet —
          # `helm repo index` reconstruit l'index depuis les archives présentes, il n'y a aucune
          # fusion à faire à la main.
          for attempt in 1 2 3; do
            git -C charts-repo fetch origin main
            git -C charts-repo reset --hard origin/main
            git -C charts-repo clean -fd
            # Le tag fait foi : le chart publié porte la version qui a déclenché la CI, même si
            # le Chart.yaml du dépôt n'avait pas été bumpé.
            helm package deploy/helm/kdt-web \
              --version "$version" --app-version "$version" --destination charts-repo
            cd charts-repo
            helm repo index . --url "$url"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --cached --quiet; then
              echo "kdt-web $version est déjà publié"
              exit 0
            fi
            git commit -m "kdt-web $version"
            git push && exit 0
            cd ..
          done
          echo "publication du chart refusée après trois tentatives" >&2
          exit 1

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Get app name
        # Le paquet de la racine, désigné par son manifeste : depuis que le dépôt est un
        # workspace, `.packages[0]` rendait `kdt-web`, dont ces deux jobs ne construisent aucun
        # binaire — le tarball et `lipo` cherchaient alors un fichier qui n'existe pas.
        run: |
          name=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg m "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $m) | .name')
          [ -n "$name" ] || { echo "paquet racine introuvable" >&2; exit 1; }
          echo "APP_NAME=$name" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install pkg-config

      - run: cargo build --release --target aarch64-apple-darwin

      - run: cargo build --release --target x86_64-apple-darwin

      - run: |
          lipo -create -output $APP_NAME \
            target/aarch64-apple-darwin/release/$APP_NAME \
            target/x86_64-apple-darwin/release/$APP_NAME

      - run: tar czf $APP_NAME-macos-universal.tar.gz $APP_NAME

      - name: Build Homebrew bottle (all tag)
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bottle/$APP_NAME/$version/bin
          cp $APP_NAME bottle/$APP_NAME/$version/bin/
          tar czf "$APP_NAME-$version.all.bottle.tar.gz" -C bottle $APP_NAME

      - name: Release notes from the CHANGELOG
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          # `prerelease` vaut false par défaut, sans aucune détection SemVer : sans cette ligne,
          # une v2.0.0-beta.1 serait publiée comme la dernière version stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.APP_NAME }}-macos-universal.tar.gz
            ${{ env.APP_NAME }}-*.all.bottle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Get app name
        # Le paquet de la racine, désigné par son manifeste : depuis que le dépôt est un
        # workspace, `.packages[0]` rendait `kdt-web`, dont ces deux jobs ne construisent aucun
        # binaire — le tarball et `lipo` cherchaient alors un fichier qui n'existe pas.
        run: |
          name=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg m "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $m) | .name')
          [ -n "$name" ] || { echo "paquet racine introuvable" >&2; exit 1; }
          echo "APP_NAME=$name" >> $GITHUB_ENV

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm

      - name: Build .deb and .rpm
        run: |
          packaging/build-deb.sh
          packaging/build-rpm.sh

      - name: Package static binary tarball
        run: tar czf $APP_NAME-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release $APP_NAME

      - name: Release notes from the CHANGELOG
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          # `prerelease` vaut false par défaut, sans aucune détection SemVer : sans cette ligne,
          # une v2.0.0-beta.1 serait publiée comme la dernière version stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.APP_NAME }}-linux-x86_64.tar.gz
            dist/*.deb
            dist/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    runs-on: ubuntu-24.04
    needs: [build-macos, build-linux]
    # La formule du tap est ce que `brew upgrade` suit : une pré-version n'a rien à y faire, elle
    # basculerait tout le monde sur une alpha.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: agardenat/homebrew-kdt
          token: ${{ secrets.COMMITTER_TOKEN }}
          path: tap

      - name: Generate multi-platform formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/agardenat/kdt/releases/download/${TAG}"
          gh release download "$TAG" --repo agardenat/kdt \
            --pattern 'kdt-macos-universal.tar.gz' \
            --pattern "kdt-${version}.all.bottle.tar.gz" \
            --dir assets
          src_sha=$(sha256sum assets/kdt-macos-universal.tar.gz | cut -d' ' -f1)
          bottle_sha=$(sha256sum "assets/kdt-${version}.all.bottle.tar.gz" | cut -d' ' -f1)
          mkdir -p tap/Formula
          cat > tap/Formula/kdt.rb <<EOF
          class Kdt < Formula
            desc "Kubernetes diagnostics, events and logs in a terminal UI"
            homepage "https://github.com/agardenat/kdt"
            version "${version}"
            url "${base}/kdt-macos-universal.tar.gz"
            sha256 "${src_sha}"

            depends_on :macos

            bottle do
              root_url "${base}"
              sha256 cellar: :any_skip_relocation, all: "${bottle_sha}"
            end

            def install
              bin.install "kdt"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kdt --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kdt.rb
          git commit -m "kdt ${version}"
          git push