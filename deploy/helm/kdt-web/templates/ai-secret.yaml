{{/*
  Les fournisseurs d'IA déclarés par l'exploitant, avec leurs clés.

  Créé seulement si `ai.providers` est renseigné et qu'aucun Secret existant n'est nommé : une clé
  API dans des `values.yaml` versionnés est un choix qui se prend, et `ai.existingSecret` est là
  pour ceux qui ne le prennent pas.
*/}}
{{- if and .Values.ai.providers (not .Values.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kdt-web.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  providers: |
    {{- if kindIs "string" .Values.ai.providers }}
    {{ .Values.ai.providers | nindent 4 | trim }}
    {{- else }}
    {{ .Values.ai.providers | toJson | nindent 4 | trim }}
    {{- end }}
{{- end }}
