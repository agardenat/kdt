{{/*
  Le compte de service de kdt-web, et c'est tout : **aucun Role, aucun ClusterRole, aucun
  binding**. Ce n'est pas un oubli, c'est la propriété principale du composant.

  Chaque requête au cluster part avec le credential de la personne connectée, obtenu du portail :
  l'apiserver voit `kdt:alice` et ses groupes, et le RBAC du cluster s'applique tel quel. Ce que
  ce compte de service peut faire ne change donc rien à ce que kdt-web peut faire — et lui
  accorder des droits « en attendant » les donnerait à tout le monde d'un coup.

  Le jeton est monté malgré tout : kdt-web n'en lit que l'adresse de l'apiserver et la CA qui le
  valide, jamais l'identité, qu'il efface au démarrage.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kdt-web.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-web.labels" . | nindent 4 }}
automountServiceAccountToken: true
