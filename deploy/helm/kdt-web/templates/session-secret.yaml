{{/*
  Clé de signature du cookie de session.

  `lookup` relit la clé déjà installée pour qu'une montée de version ne déconnecte pas tout le
  monde. Sans cette précaution, chaque `helm upgrade` engendrerait une clé neuve et invaliderait
  les cookies en cours — le helm-controller de Flux résout `lookup` comme le CLI, la
  synchronisation ne repose donc pas le problème à chaque passage.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-session" (include "kdt-web.fullname" .)) -}}
{{- $key := "" -}}
{{- if .Values.sessionKey -}}
  {{- $key = .Values.sessionKey | b64enc -}}
{{- else if and $existing $existing.data -}}
  {{- $key = index $existing.data "session-key" -}}
{{- else -}}
  {{- $key = randBytes 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kdt-web.fullname" . }}-session
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-web.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ $key }}
